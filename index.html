    window.AUTH = {
      // @idhospital.com 메일로 인증 링크 발송
      async sendLink(email, docId) {
        if (!email.toLowerCase().endsWith("@idhospital.com")) {
          throw new Error("@idhospital.com 사내 메일만 사용 가능합니다.");
        }
        // view 파라미터를 redirectUrl에 포함
        const base = window.location.origin + window.location.pathname;
        const redirectUrl = docId ? `${base}?view=${docId}` : base;
        const actionCodeSettings = {
          url: redirectUrl,
          handleCodeInApp: true,
        };
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        localStorage.setItem("emailForSignIn", email);
        if (docId) localStorage.setItem("docIdForSignIn", docId);
      },
      // 메일 링크로 돌아왔을 때 자동 로그인
      async handleEmailLink() {
        if (!isSignInWithEmailLink(auth, window.location.href)) return null;
        let email = localStorage.getItem("emailForSignIn");
        if (!email) {
          let local = window.prompt("인증에 사용한 이메일 아이디를 입력해주세요.\n(@idhospital.com은 자동으로 붙습니다)");
          if (local) {
            local = local.trim().toLowerCase().replace(/@.*$/, "");
            if (local) email = local + "@idhospital.com";
          }
        }
        if (!email) return null;

        // view 파라미터 미리 확보
        const params = new URLSearchParams(window.location.search);
        let viewId   = params.get("view") || localStorage.getItem("docIdForSignIn");

        let user = null;
        try {
          const result = await signInWithEmailLink(auth, email, window.location.href);
          user = result.user;
        } catch(e) {
          // 링크 코드가 이미 소모된 경우 (재클릭, 사내 메일 보안 스캔 등)
          if (e.code === "auth/invalid-action-code" || e.code === "auth/expired-action-code") {
            // 이미 로그인된 세션이 있으면 그대로 인정
            const existing = await new Promise(resolve => {
              const unsub = onAuthStateChanged(auth, u => { unsub(); resolve(u); });
              setTimeout(() => resolve(auth.currentUser), 3000);
            });
            if (existing && existing.email &&
                existing.email.toLowerCase().endsWith("@idhospital.com")) {
              user = existing;
            } else {
              throw new Error("인증 링크가 만료되었습니다. 인증 메일을 다시 요청해주세요.");
            }
          } else {
            throw e;
          }
        }

        localStorage.removeItem("emailForSignIn");
        localStorage.removeItem("docIdForSignIn");
        // URL을 깔끔하게 정리
        const clean = window.location.pathname + (viewId ? `?view=${viewId}` : "");
        window.history.replaceState(null, "", clean);
        return { user, viewId };
      },
      // 현재 로그인 상태 구독
      onAuthChange(cb) {
        return onAuthStateChanged(auth, cb);
      },
      async signOut() {
        await signOut(auth);
      },
      getCurrentUser() {
        return auth.currentUser;
      }
    };

    // ── DB helpers ──────────────────────────────────────────────────────────────
    window.DB = {
      async getDocs() {
        const snap = await get(ref(db, "documents"));
        return snap.exists() ? Object.values(snap.val()) : [];
      },
      // 단일 문서만 빠르게 조회
      async getDoc(docId) {
        const snap = await get(ref(db, `documents/${docId}`));
        return snap.exists() ? snap.val() : null;
      },
      async getCounter() {
        const snap = await get(ref(db, "counter"));
        return snap.exists() ? snap.val() : 1;
      },
      async saveDoc(doc) {
        await set(ref(db, `documents/${doc.id}`), doc);
      },
      async setCounter(n) {
        await set(ref(db, "counter"), n);
      },
      async getDefaultPw() {
        const snap = await get(ref(db, "defaultPw"));
        return snap.exists() ? snap.val() : "1234";
      },
      async setDefaultPw(pw) {
        await set(ref(db, "defaultPw"), pw);
      },
      async getLogs() {
        const snap = await get(ref(db, "logs"));
        if (!snap.exists()) return [];
        return Object.values(snap.val());
      },
      async addLog(log) {
        await push(ref(db, "logs"), log);
      },
      async incViewCount(docId) {
        const snap = await get(ref(db, `documents/${docId}/viewCount`));
        const cur  = snap.exists() ? snap.val() : 0;
        await set(ref(db, `documents/${docId}/viewCount`), cur + 1);
      },
      onDocs(cb) {
        return onValue(ref(db, "documents"), snap => {
          cb(snap.exists() ? Object.values(snap.val()) : []);
        });
      },
    };

    window.__DB_READY__ = true;
    window.dispatchEvent(new Event("firebase-ready"));
  </script>

  <!-- React + Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react" data-type="module">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Helpers ────────────────────────────────────────────────────────────────
    function genLinkId(n) { return `IDH-Planning-Coordination-${String(n).padStart(3,"0")}`; }

    // ── Logo ───────────────────────────────────────────────────────────────────
    function IDHLogo({ dark }) {
      const korColor = dark ? "#ffffff" : "#1a2340";
      const subColor = dark ? "rgba(255,255,255,0.55)" : "#8892a4";
      return (
        <div style={{ display:"flex", alignItems:"center", gap:8, userSelect:"none" }}>
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="14" fill="#e91e8c"/>
            <text x="18" y="23" textAnchor="middle" fill="white"
                  fontSize="13" fontWeight="900" fontFamily="'Sora','Arial',sans-serif" letterSpacing="-0.5">id</text>
          </svg>
          <div style={{ lineHeight:1 }}>
            <div style={{ color:korColor, fontWeight:800, fontSize:16, fontFamily:"'Sora','Apple SD Gothic Neo','Malgun Gothic',sans-serif", letterSpacing:0.2, lineHeight:1.15 }}>아이디병원</div>
            <div style={{ color:subColor, fontWeight:500, fontSize:9.5, fontFamily:"'Sora',sans-serif", letterSpacing:1.6, textTransform:"uppercase", marginTop:1 }}>ID HOSPITAL</div>
          </div>
        </div>
      );
    }

    // ── Shared UI ──────────────────────────────────────────────────────────────
    const inputStyle = {
      width:"100%", border:"1.5px solid #dde1ea", borderRadius:9,
      padding:"11px 13px", fontSize:14, outline:"none",
      boxSizing:"border-box", fontFamily:"'Sora',sans-serif",
      color:"#1a2340", background:"#f8f9fc", transition:"border-color .2s"
    };
    function Field({ label, children }) {
      return (
        <div style={{ marginBottom:20 }}>
          <label style={{ color:"#4a5568", fontSize:12, fontWeight:600, display:"block", marginBottom:7, letterSpacing:0.3 }}>{label}</label>
          {children}
        </div>
      );
    }
    function InfoChip({ label, value }) {
      return <span style={{ fontSize:11, color:"#8892a4" }}><span style={{ fontWeight:700, color:"#1a2340" }}>{label}: </span>{value}</span>;
    }
    function CopyLinkBtn({ docId }) {
      const [copied, setCopied] = useState(false);
      return (
        <button onClick={() => {
          const link = `${window.location.origin}${window.location.pathname}?view=${docId}`;
          navigator.clipboard.writeText(link).then(() => { setCopied(true); setTimeout(()=>setCopied(false),2000); });
        }} style={{ flex:1, background: copied?"#e91e8c":"rgba(233,30,140,0.08)", color: copied?"#fff":"#e91e8c", border:"1.5px solid #e91e8c", borderRadius:8, padding:"9px 0", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Sora',sans-serif", transition:"all .2s" }}>
          {copied ? "✓ 복사됨" : "🔗 공유 링크 복사"}
        </button>
      );
    }
    function Loader({ text }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16, padding:"60px 0" }}>
          <div className="spinner"/>
          <div style={{ color:"#8892a4", fontSize:13 }}>{text || "불러오는 중..."}</div>
        </div>
      );
    }

    // ── ADMIN PAGE ─────────────────────────────────────────────────────────────
    function AdminPage({ docs, counter, setCounter, defaultPw, setDefaultPw, refreshDocs }) {
      const [tab, setTab]             = useState("create");
      const [form, setForm]           = useState({ docName:"", url:"", expiryDate:"", expiryHour:"23" });
      const [newDefaultPw, setNewDPw] = useState("");
      const [confirmDef, setConfDef]  = useState("");
      const [showDef, setShowDef]     = useState(false);
      const [created, setCreated]     = useState(null);
      const [copied, setCopied]       = useState(false);
      const [error, setError]         = useState("");
      const [pwError, setPwError]     = useState("");
      const [saving, setSaving]       = useState(false);

      const handleCreate = async () => {
        setError("");
        if (!form.docName.trim()) { setError("문서 이름을 입력해주세요."); return; }
        if (!form.url)            { setError("문서 URL을 입력해주세요."); return; }
        if (!form.expiryDate)     { setError("열람 마감 기한을 설정해주세요."); return; }

        setSaving(true);
        const linkId    = genLinkId(counter);
        const expiryISO = new Date(`${form.expiryDate}T${String(form.expiryHour).padStart(2,"0")}:00:00`).toISOString();
        const newDoc    = { id:linkId, docName:form.docName.trim(), url:form.url, expiry:expiryISO, createdAt:new Date().toISOString(), viewCount:0 };

        await window.DB.saveDoc(newDoc);
        await window.DB.setCounter(counter + 1);
        setCounter(counter + 1);
        setCreated(newDoc);
        setForm({ docName:"", url:"", expiryDate:"", expiryHour:"23" });
        setSaving(false);
      };

      const shareLink = created ? `${window.location.origin}${window.location.pathname}?view=${created.id}` : "";

      const handleSetDefault = async () => {
        setPwError("");
        if (!/^\d{4}$/.test(newDefaultPw))    { setPwError("4자리 숫자만 입력 가능합니다."); return; }
        if (newDefaultPw !== confirmDef)       { setPwError("비밀번호가 일치하지 않습니다."); return; }
        await window.DB.setDefaultPw(newDefaultPw);
        setDefaultPw(newDefaultPw);
        setNewDPw(""); setConfDef("");
        alert("디폴트 비밀번호가 설정되었습니다.");
      };

      const tabStyle = t => ({
        padding:"10px 22px", borderRadius:"8px 8px 0 0",
        background: tab===t ? "#1a2340" : "transparent",
        color: tab===t ? "#fff" : "#8892a4",
        fontWeight: tab===t ? 700 : 500,
        cursor:"pointer", border:"none", fontSize:13,
        fontFamily:"'Sora',sans-serif", transition:"all .2s",
      });

      return (
        <div style={{ minHeight:"100vh", background:"#f0f2f7", fontFamily:"'Sora',sans-serif", paddingBottom:80 }}>
          <div style={{ background:"#1a2340", padding:"0 32px", display:"flex", alignItems:"center", justifyContent:"space-between", height:64, boxShadow:"0 2px 12px rgba(26,35,64,0.2)" }}>
            <IDHLogo dark />
            <div style={{ color:"#e91e8c", fontWeight:700, fontSize:13, letterSpacing:2, textTransform:"uppercase" }}>Planning {"&"} Coordination · Admin</div>
          </div>

          <div style={{ maxWidth:720, margin:"40px auto", padding:"0 16px" }}>
            <div style={{ marginBottom:24 }}>
              <h1 style={{ color:"#1a2340", fontSize:24, fontWeight:800, margin:0, letterSpacing:-0.5 }}>문서 보안 공유 시스템</h1>
              <p style={{ color:"#8892a4", fontSize:13, margin:"6px 0 0" }}>민감 문서를 비밀번호로 보호하여 안전하게 공유하세요</p>
            </div>

            <div style={{ display:"flex", borderBottom:"2px solid #1a2340" }}>
              <button style={tabStyle("create")}    onClick={()=>setTab("create")}>링크 생성</button>
              <button style={tabStyle("list")}      onClick={()=>{ setTab("list"); refreshDocs(); }}>생성 목록 ({docs.length})</button>
              <button style={tabStyle("defaultpw")} onClick={()=>setTab("defaultpw")}>디폴트 비밀번호</button>
            </div>

            <div style={{ background:"#fff", borderRadius:"0 8px 8px 8px", padding:32, boxShadow:"0 4px 20px rgba(26,35,64,0.08)" }}>

              {/* CREATE */}
              {tab==="create" && (
                <div>
                  {created && (
                    <div style={{ background:"linear-gradient(135deg,#1a2340,#2d3a6b)", borderRadius:12, padding:24, marginBottom:28, position:"relative", overflow:"hidden" }}>
                      <div style={{ position:"absolute", right:-20, top:-20, width:120, height:120, borderRadius:"50%", background:"rgba(233,30,140,0.15)" }}/>
                      <div style={{ color:"#e91e8c", fontWeight:700, fontSize:11, letterSpacing:2, marginBottom:8 }}>✓ 링크 생성 완료</div>
                      <div style={{ color:"#fff", fontWeight:800, fontSize:16, marginBottom:2 }}>{created.docName}</div>
                      <div style={{ color:"rgba(255,255,255,0.45)", fontSize:11, marginBottom:6 }}>{created.id}</div>
                      <div style={{ background:"rgba(255,255,255,0.1)", borderRadius:8, padding:"10px 14px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginTop:12 }}>
                        <span style={{ color:"#c8d0e0", fontSize:11, wordBreak:"break-all", flex:1 }}>{shareLink}</span>
                        <button onClick={()=>{ navigator.clipboard.writeText(shareLink).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }); }}
                          style={{ background:copied?"#e91e8c":"rgba(233,30,140,0.2)", color:copied?"#fff":"#e91e8c", border:"1px solid #e91e8c", borderRadius:6, padding:"6px 14px", cursor:"pointer", fontWeight:700, fontSize:12, whiteSpace:"nowrap", transition:"all .2s" }}>
                          {copied ? "✓ 복사됨" : "링크 복사"}
                        </button>
                      </div>
                      <button onClick={()=>setCreated(null)} style={{ marginTop:12, background:"transparent", border:"none", color:"#8892a4", fontSize:11, cursor:"pointer" }}>닫기</button>
                    </div>
                  )}

                  {error && <div style={{ background:"#fff0f4", border:"1px solid #e91e8c", borderRadius:8, padding:"10px 14px", color:"#c4166e", fontSize:13, marginBottom:20 }}>{error}</div>}

                  <Field label="문서 이름 *">
                    <input value={form.docName} onChange={e=>setForm({...form,docName:e.target.value})}
                      placeholder="예: 2605월 마감보고 · Asian Beauty Center"
                      style={inputStyle}/>
                  </Field>
                  <Field label="문서 URL (Google Drive 등)">
                    <input value={form.url} onChange={e=>setForm({...form,url:e.target.value})} placeholder="https://drive.google.com/file/d/..." style={inputStyle}/>
                  </Field>
                  <Field label="열람 마감 기한">
                    <div style={{ display:"flex", gap:10 }}>
                      <input type="date" value={form.expiryDate} onChange={e=>setForm({...form,expiryDate:e.target.value})} style={{...inputStyle,flex:1}}/>
                      <select value={form.expiryHour} onChange={e=>setForm({...form,expiryHour:e.target.value})} style={{...inputStyle,width:110}}>
                        {Array.from({length:24},(_,i)=><option key={i} value={i}>{String(i).padStart(2,"0")}:00</option>)}
                      </select>
                    </div>
                  </Field>
                  {/* 인증 방식 안내 */}
                  <div style={{ background:"#f8f9fc", border:"1px solid #dde1ea", borderRadius:10, padding:"14px 16px", marginBottom:20 }}>
                    <div style={{ fontSize:12, color:"#1a2340", fontWeight:700, marginBottom:8 }}>📋 열람 인증 방식</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                      <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
                        <span style={{ background:"#e91e8c", color:"#fff", fontSize:10, fontWeight:700, padding:"2px 7px", borderRadius:20, whiteSpace:"nowrap", marginTop:1 }}>마감 전</span>
                        <span style={{ fontSize:12, color:"#4a5568", lineHeight:1.5 }}>@idhospital.com 사내 메일 인증만으로 열람 가능</span>
                      </div>
                      <div style={{ display:"flex", alignItems:"flex-start", gap:8 }}>
                        <span style={{ background:"#8892a4", color:"#fff", fontSize:10, fontWeight:700, padding:"2px 7px", borderRadius:20, whiteSpace:"nowrap", marginTop:1 }}>마감 후</span>
                        <span style={{ fontSize:12, color:"#4a5568", lineHeight:1.5 }}>디폴트 비밀번호 + 사내 메일 인증 모두 필요</span>
                      </div>
                    </div>
                  </div>
                  <button onClick={handleCreate} disabled={saving}
                    style={{ width:"100%", background: saving?"#aab0be":"linear-gradient(135deg,#e91e8c,#c4166e)", color:"#fff", border:"none", borderRadius:10, padding:"14px 0", fontWeight:800, fontSize:15, cursor: saving?"not-allowed":"pointer", letterSpacing:0.5, boxShadow:"0 4px 16px rgba(233,30,140,0.35)", marginTop:8, fontFamily:"'Sora',sans-serif" }}>
                    {saving ? "저장 중..." : "설정 완료 · 공유 링크 생성"}
                  </button>
                </div>
              )}

              {/* LIST */}
              {tab==="list" && (
                <div>
                  {docs.length===0
                    ? <div style={{ textAlign:"center", color:"#aab0be", padding:"40px 0", fontSize:14 }}>생성된 링크가 없습니다</div>
                    : <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                        {[...docs].sort((a,b)=>b.createdAt?.localeCompare(a.createdAt||"")||0).map(doc => {
                          const expired = new Date(doc.expiry) < new Date();
                          return (
                            <div key={doc.id} style={{ border:"1px solid #dde1ea", borderRadius:10, padding:16, position:"relative", overflow:"hidden" }}>
                              <div style={{ position:"absolute", top:0, left:0, width:4, height:"100%", background:expired?"#aab0be":"#e91e8c" }}/>
                              <div style={{ paddingLeft:8 }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:8 }}>
                                  <div>
                                    <div style={{ fontWeight:800, fontSize:14, color:"#1a2340" }}>{doc.docName || doc.id}</div>
                                    {doc.docName && <div style={{ fontWeight:500, fontSize:11, color:"#aab0be", marginTop:2 }}>{doc.id}</div>}
                                  </div>
                                  <span style={{ background:expired?"#f0f2f7":"#fff0f8", color:expired?"#8892a4":"#e91e8c", fontSize:10, fontWeight:700, padding:"3px 8px", borderRadius:20, border:`1px solid ${expired?"#dde1ea":"#f9a8d4"}` }}>
                                    {expired ? "마감 (비번+이메일 인증)" : "열람 가능 (이메일 인증)"}
                                  </span>
                                </div>
                                <div style={{ color:"#8892a4", fontSize:11, marginTop:4, wordBreak:"break-all" }}>{doc.url?.length>60?doc.url.slice(0,60)+"...":doc.url}</div>
                                <div style={{ display:"flex", gap:16, marginTop:8, flexWrap:"wrap" }}>
                                  <InfoChip label="마감" value={new Date(doc.expiry).toLocaleString("ko-KR")}/>
                                  <InfoChip label="조회" value={`${doc.viewCount||0}회`}/>
                                </div>
                                <div style={{ display:"flex", gap:8, marginTop:12 }}>
                                  <button onClick={()=>window.open(doc.url,"_blank")}
                                    style={{ flex:1, background:"linear-gradient(135deg,#1a2340,#2d3a6b)", color:"#fff", border:"none", borderRadius:8, padding:"9px 0", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                                    📄 문서 바로가기
                                  </button>
                                  <CopyLinkBtn docId={doc.id}/>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                  }
                </div>
              )}

              {/* DEFAULT PW */}
              {tab==="defaultpw" && (
                <div>
                  <div style={{ background:"linear-gradient(135deg,#1a2340,#2d3a6b)", borderRadius:12, padding:20, marginBottom:24, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                    <div>
                      <div style={{ color:"#8892a4", fontSize:11, letterSpacing:1 }}>현재 디폴트 비밀번호</div>
                      <div style={{ color:"#e91e8c", fontWeight:800, fontSize:28, letterSpacing:8, marginTop:4 }}>{showDef?defaultPw:"••••"}</div>
                    </div>
                    <button onClick={()=>setShowDef(!showDef)} style={{ background:"rgba(233,30,140,0.15)", border:"1px solid rgba(233,30,140,0.3)", color:"#e91e8c", borderRadius:8, padding:"8px 16px", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                      {showDef?"숨기기":"확인"}
                    </button>
                  </div>
                  {pwError && <div style={{ background:"#fff0f4", border:"1px solid #e91e8c", borderRadius:8, padding:"10px 14px", color:"#c4166e", fontSize:13, marginBottom:16 }}>{pwError}</div>}
                  <Field label="새 디폴트 비밀번호 (4자리 숫자)">
                    <input type="text" maxLength={4} value={newDefaultPw} onChange={e=>setNewDPw(e.target.value.replace(/\D/g,""))}
                      placeholder="4자리 숫자 입력" style={{...inputStyle,letterSpacing:8,fontSize:18,fontWeight:700}}/>
                  </Field>
                  <Field label="비밀번호 확인">
                    <input type="text" maxLength={4} value={confirmDef} onChange={e=>setConfDef(e.target.value.replace(/\D/g,""))}
                      placeholder="4자리 숫자 재입력" style={{...inputStyle,letterSpacing:8,fontSize:18,fontWeight:700}}/>
                  </Field>
                  <button onClick={handleSetDefault} style={{ width:"100%", background:"linear-gradient(135deg,#e91e8c,#c4166e)", color:"#fff", border:"none", borderRadius:10, padding:"13px 0", fontWeight:800, fontSize:14, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                    디폴트 비밀번호 변경
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── EMAIL VERIFY PAGE ──────────────────────────────────────────────────────
    function PasswordPage({ docId, docs, defaultPw, onSuccess, loading }) {
      const [step,    setStep]    = useState("input");  // input | pwcheck | sent | verifying | error
      const [email,   setEmail]   = useState("");
      const [pwInput, setPwInput] = useState("");
      const [error,   setError]   = useState("");
      const [sending, setSending] = useState(false);
      const [shake,   setShake]   = useState(false);

      const doc     = docs.find(d => d.id === docId);
      const expired = doc ? new Date(doc.expiry) < new Date() : false;

      // 당일 24:00까지 유효한 인증 패스
      const getDayPass = (id) => {
        try {
          const raw = localStorage.getItem(`idh_pass_${id}`);
          if (!raw) return null;
          const p = JSON.parse(raw);
          if (Date.now() < p.until) return p;
          localStorage.removeItem(`idh_pass_${id}`);
          return null;
        } catch { return null; }
      };
      const saveDayPass = (id, userEmail) => {
        const until = new Date(); until.setHours(24,0,0,0); // 당일 24:00
        try { localStorage.setItem(`idh_pass_${id}`, JSON.stringify({ email:userEmail, until:until.getTime() })); } catch {}
      };

      // 로그 저장을 확실히 완료한 후 문서로 이동 (통계 누락 방지)
      const logAndOpen = async (targetDoc, userEmail) => {
        const entry = { docId:targetDoc.id, name:userEmail, time:new Date().toISOString(), linkId:targetDoc.id };

        // 1차 시도 → 실패 시 1회 재시도 (네트워크 순간 오류 대비)
        let logged = false;
        for (let attempt = 0; attempt < 2 && !logged; attempt++) {
          try {
            await window.DB.addLog(entry);
            logged = true;
          } catch (err) {
            console.warn(`로그 저장 실패 (시도 ${attempt+1})`, err);
            if (attempt === 0) await new Promise(r=>setTimeout(r, 600));
          }
        }

        // 최후 수단: 페이지 이동에 영향받지 않는 sendBeacon으로 재전송
        if (!logged && navigator.sendBeacon) {
          try {
            const url = "https://idh--share-default-rtdb.asia-southeast1.firebasedatabase.app/logs.json";
            navigator.sendBeacon(url, new Blob([JSON.stringify(entry)], { type:"text/plain" }));
          } catch {}
        }

        // 조회수 증가 (실패해도 진행)
        try { await window.DB.incViewCount(targetDoc.id); } catch {}

        window.location.href = targetDoc.url;
      };

      // 페이지 로드 시 — 메일 링크 처리 또는 당일 패스 확인
      useEffect(() => {
        const isEmailLink = window.location.href.includes("oobCode");

        // 당일 패스가 있으면 인증 없이 바로 열기
        if (!isEmailLink && docId) {
          const pass = getDayPass(docId);
          if (pass) {
            setStep("verifying");
            const openNow = async () => {
              try {
                let tries = 0;
                while (!window.DB && tries++ < 50) await new Promise(r=>setTimeout(r,100));
                const targetDoc = docs.find(d => d.id === docId) || await window.DB.getDoc(docId);
                if (!targetDoc) { setStep(expired ? "pwcheck" : "input"); return; }
                await logAndOpen(targetDoc, pass.email);
              } catch(e) {
                console.error("당일 패스 열람 오류:", e);
                setStep(expired ? "pwcheck" : "input");
              }
            };
            openNow();
            return;
          }
        }

        if (!isEmailLink) { setStep(expired ? "pwcheck" : "input"); return; }

        const run = async () => {
          setStep("verifying");
          try {
            let tries = 0;
            while (!window.AUTH && tries++ < 50) await new Promise(r=>setTimeout(r,100));
            if (!window.AUTH) throw new Error("인증 시스템을 불러오지 못했습니다.");

            // 인증과 동시에 문서를 병렬로 미리 조회 (속도 최적화)
            const params   = new URLSearchParams(window.location.search);
            const preId    = params.get("view") || localStorage.getItem("docIdForSignIn") || docId;
            const docFetch = preId ? window.DB.getDoc(preId) : Promise.resolve(null);

            const [result, preDoc] = await Promise.all([
              window.AUTH.handleEmailLink(),
              docFetch
            ]);
            if (!result) { setStep("input"); return; }

            const { user, viewId: resolvedId } = result;
            const targetId = resolvedId || docId;

            // 이미 병렬로 받아온 문서 사용, 없으면 단일 조회
            let targetDoc = (preDoc && preDoc.id === targetId) ? preDoc
                          : docs.find(d => d.id === targetId);
            if (!targetDoc && targetId) {
              targetDoc = await window.DB.getDoc(targetId);
            }
            if (!targetDoc) { setError("문서를 찾을 수 없습니다."); setStep("error"); return; }

            // 당일 24:00까지 재인증 없이 열람 가능한 패스 저장
            saveDayPass(targetDoc.id, user.email);

            // 로그 저장 확인 후 문서로 이동 (최대 2초 대기)
            await logAndOpen(targetDoc, user.email);
          } catch(e) {
            console.error(e);
            let msg = e.message || "인증에 실패했습니다. 다시 시도해주세요.";
            if (msg.includes("invalid-action-code") || msg.includes("expired-action-code"))
              msg = "인증 링크가 만료되었거나 이미 사용되었습니다. 아래에서 인증 메일을 다시 요청해주세요.";
            else if (msg.includes("quota-exceeded"))
              msg = "오늘 인증 메일 발송 한도를 초과했습니다. 잠시 후 다시 시도해주세요.";
            else if (msg.includes("network"))
              msg = "네트워크 연결을 확인해주세요.";
            setError(msg);
            setStep("error");
          }
        };
        run();
      }, []);

      const triggerShake = () => { setShake(true); setTimeout(()=>setShake(false),500); };

      // 마감 후: 디폴트 비밀번호 확인
      const handlePwCheck = () => {
        setError("");
        if (!pwInput) { setError("비밀번호를 입력해주세요."); triggerShake(); return; }
        if (pwInput !== defaultPw) { setError("비밀번호가 올바르지 않습니다."); triggerShake(); setPwInput(""); return; }
        setStep("input"); // 비번 확인 후 이메일 인증으로
      };

      // 이메일 인증 링크 발송 (아이디만 입력 → @idhospital.com 자동 부착)
      const handleSend = async () => {
        setError("");
        const local = email.trim().toLowerCase().replace(/@.*$/, "");
        if (!local) { setError("이메일 아이디를 입력해주세요."); triggerShake(); return; }
        if (!/^[a-z0-9._%+-]+$/.test(local)) { setError("올바른 이메일 아이디를 입력해주세요."); triggerShake(); return; }
        if (!doc) { setError("존재하지 않는 문서입니다."); return; }
        const fullEmail = `${local}@idhospital.com`;

        // spark 계정: 인증 메일 없이 즉시 열람
        if (local === "spark") {
          setStep("verifying");
          try {
            saveDayPass(doc.id, fullEmail);
            await logAndOpen(doc, fullEmail);
          } catch(e) {
            setError("문서를 여는 중 오류가 발생했습니다."); setStep("error");
          }
          return;
        }

        setSending(true);
        try {
          await window.AUTH.sendLink(fullEmail, docId);
          setEmail(local);
          setStep("sent");
        } catch(e) {
          setError(e.message || "메일 발송에 실패했습니다."); triggerShake();
        }
        setSending(false);
      };

      const pageInput = {
        width:"100%", background:"rgba(255,255,255,0.07)",
        border:"1px solid rgba(255,255,255,0.15)", borderRadius:10,
        padding:"12px 14px", color:"#fff", fontSize:15,
        outline:"none", boxSizing:"border-box", fontFamily:"'Sora',sans-serif", transition:"border-color .2s"
      };

      if (loading || step === "verifying") return (
        <div style={{ minHeight:"100vh", background:"linear-gradient(160deg,#0d1526 0%,#1a2340 50%,#0d1526 100%)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16 }}>
          <div className="spinner"/>
          <div style={{ color:"rgba(255,255,255,0.5)", fontSize:13, fontFamily:"'Sora',sans-serif" }}>
            {step==="verifying" ? "이메일 인증 확인 중..." : "불러오는 중..."}
          </div>
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:"linear-gradient(160deg,#0d1526 0%,#1a2340 50%,#0d1526 100%)", display:"flex", flexDirection:"column", fontFamily:"'Sora',sans-serif", position:"relative", overflow:"hidden" }}>
          <div style={{ position:"absolute", top:-120, right:-120, width:400, height:400, borderRadius:"50%", background:"radial-gradient(circle,rgba(233,30,140,0.12) 0%,transparent 70%)" }}/>
          <div style={{ position:"absolute", bottom:-80, left:-80, width:300, height:300, borderRadius:"50%", background:"radial-gradient(circle,rgba(233,30,140,0.08) 0%,transparent 70%)" }}/>

          <div style={{ padding:"20px 32px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <IDHLogo dark />
            <div style={{ color:"rgba(255,255,255,0.3)", fontSize:10, letterSpacing:2, textTransform:"uppercase" }}>Secure Document Access</div>
          </div>

          <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px 16px" }}>
            <div style={{ width:"100%", maxWidth:420 }}>

              {/* 아이콘 + 타이틀 */}
              <div style={{ textAlign:"center", marginBottom:32 }}>
                <div style={{ width:72, height:72, background: step==="pwcheck" ? "linear-gradient(135deg,#8892a4,#4a5568)" : "linear-gradient(135deg,#e91e8c,#c4166e)", borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 16px", boxShadow:"0 8px 32px rgba(233,30,140,0.4)" }}>
                  {step==="sent"
                    ? <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M3 8l9 6 9-6M5 6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
                    : step==="pwcheck"
                    ? <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" fill="white"/><path d="M8 11V7a4 4 0 018 0v4" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
                    : <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M3 8l9 6 9-6M5 6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
                  }
                </div>
                <h2 style={{ color:"#fff", fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.5 }}>
                  {step==="pwcheck" ? "열람 기한 만료" : step==="sent" ? "메일을 확인해주세요" : "보안 문서 접근"}
                </h2>
                {doc && <div style={{ color:"#e91e8c", fontSize:12, marginTop:8, fontWeight:700 }}>{doc.docName || doc.id}</div>}
                <p style={{ color:"rgba(255,255,255,0.45)", fontSize:13, marginTop:6 }}>
                  {step==="pwcheck" ? "관리자에게 받은 비밀번호를 입력해주세요"
                    : step==="sent" ? `${email}@idhospital.com 으로 인증 링크를 발송했습니다`
                    : "사내 이메일로 인증 링크를 받아 문서를 열람하세요"}
                </p>
              </div>

              <style>{`@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}`}</style>

              {/* ── Step 1: 마감 후 비밀번호 확인 ── */}
              {step==="pwcheck" && (
                <div style={{ animation:shake?"shake 0.4s":"none" }}>
                  {error && <div style={{ background:"rgba(233,30,140,0.15)", border:"1px solid rgba(233,30,140,0.4)", borderRadius:10, padding:"12px 16px", color:"#f472b6", fontSize:13, marginBottom:16, textAlign:"center" }}>{error}</div>}
                  <div style={{ background:"rgba(255,255,255,0.05)", backdropFilter:"blur(20px)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, padding:28 }}>
                    <div style={{ background:"rgba(255,255,255,0.05)", borderRadius:8, padding:"10px 14px", marginBottom:20, textAlign:"center" }}>
                      <div style={{ color:"rgba(255,255,255,0.4)", fontSize:11 }}>열람 마감일</div>
                      <div style={{ color:"#f472b6", fontSize:13, fontWeight:600, marginTop:2 }}>{doc ? new Date(doc.expiry).toLocaleString("ko-KR") : ""}</div>
                    </div>
                    <div style={{ marginBottom:20 }}>
                      <label style={{ color:"rgba(255,255,255,0.6)", fontSize:11, letterSpacing:1, display:"block", marginBottom:8, textTransform:"uppercase" }}>비밀번호</label>
                      <input type="password" value={pwInput} onChange={e=>setPwInput(e.target.value)}
                        placeholder="관리자 비밀번호 입력"
                        onKeyDown={e=>e.key==="Enter"&&handlePwCheck()}
                        style={{...pageInput, letterSpacing:4}}
                        onFocus={e=>e.target.style.borderColor="#e91e8c"}
                        onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
                    </div>
                    <button onClick={handlePwCheck}
                      style={{ width:"100%", background:"linear-gradient(135deg,#e91e8c,#c4166e)", color:"#fff", border:"none", borderRadius:10, padding:"14px 0", fontWeight:800, fontSize:15, cursor:"pointer", boxShadow:"0 4px 20px rgba(233,30,140,0.4)", fontFamily:"'Sora',sans-serif" }}>
                      확인 →
                    </button>
                  </div>
                </div>
              )}

              {/* ── Step 2: 이메일 입력 ── */}
              {(step==="input" || step==="error") && (
                <div style={{ animation:shake?"shake 0.4s":"none" }}>
                  {error && <div style={{ background:"rgba(233,30,140,0.15)", border:"1px solid rgba(233,30,140,0.4)", borderRadius:10, padding:"12px 16px", color:"#f472b6", fontSize:13, marginBottom:16, textAlign:"center" }}>{error}</div>}
                  <div style={{ background:"rgba(255,255,255,0.05)", backdropFilter:"blur(20px)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, padding:28 }}>
                    <div style={{ marginBottom:20 }}>
                      <label style={{ color:"rgba(255,255,255,0.6)", fontSize:11, letterSpacing:1, display:"block", marginBottom:8, textTransform:"uppercase" }}>사내 이메일</label>
                      <div style={{ display:"flex", alignItems:"center", background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.15)", borderRadius:10, transition:"border-color .2s" }}
                        onFocus={e=>e.currentTarget.style.borderColor="#e91e8c"}
                        onBlur={e=>e.currentTarget.style.borderColor="rgba(255,255,255,0.15)"}>
                        <input type="text" value={email}
                          onChange={e=>setEmail(e.target.value.replace(/@.*$/,""))}
                          placeholder="이메일 아이디"
                          onKeyDown={e=>e.key==="Enter"&&handleSend()}
                          style={{ flex:1, background:"transparent", border:"none", padding:"12px 0 12px 14px", color:"#fff", fontSize:15, outline:"none", fontFamily:"'Sora',sans-serif", minWidth:0 }}/>
                        <span style={{ color:"#e91e8c", fontSize:14, fontWeight:600, padding:"0 14px 0 4px", whiteSpace:"nowrap", userSelect:"none" }}>@idhospital.com</span>
                      </div>
                      <div style={{ color:"rgba(255,255,255,0.3)", fontSize:11, marginTop:6 }}>아이디만 입력하세요 · @idhospital.com은 자동으로 붙습니다</div>
                    </div>
                    <button onClick={handleSend} disabled={sending}
                      style={{ width:"100%", background:sending?"#aab0be":"linear-gradient(135deg,#e91e8c,#c4166e)", color:"#fff", border:"none", borderRadius:10, padding:"14px 0", fontWeight:800, fontSize:15, cursor:sending?"not-allowed":"pointer", boxShadow:"0 4px 20px rgba(233,30,140,0.4)", fontFamily:"'Sora',sans-serif", letterSpacing:0.5 }}>
                      {sending ? "발송 중..." : "인증 메일 받기 →"}
                    </button>
                    <div style={{ marginTop:14, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:10, padding:"12px 14px" }}>
                      <div style={{ color:"rgba(255,255,255,0.55)", fontSize:12, lineHeight:1.7, textAlign:"center" }}>
                        📬 메일 주소 입력 후 발송 버튼을 누르면<br/>
                        <span style={{ color:"#e91e8c", fontWeight:600 }}>사내 메일함을 확인</span>해주세요.<br/>
                        <span style={{ color:"rgba(255,255,255,0.35)", fontSize:11 }}>메일이 보이지 않을 경우 <span style={{ color:"#f472b6" }}>스팸메일함</span>을 확인해주세요.</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ── Step 3: 발송 완료 ── */}
              {step==="sent" && (
                <div style={{ background:"rgba(255,255,255,0.05)", backdropFilter:"blur(20px)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, padding:28 }}>
                  <div style={{ textAlign:"center", marginBottom:20 }}>
                    <div style={{ color:"rgba(255,255,255,0.7)", fontSize:14, lineHeight:1.9 }}>
                      <span style={{ color:"#e91e8c", fontWeight:700 }}>{email}@idhospital.com</span><br/>
                      으로 인증 링크를 보냈습니다.<br/>
                      메일함에서 인증 링크를 클릭하시면<br/>
                      보안 문서가 자동으로 열립니다.
                    </div>
                  </div>
                  <div style={{ background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:10, padding:"16px", marginBottom:12 }}>
                    <div style={{ color:"#e91e8c", fontSize:11, fontWeight:700, letterSpacing:1, marginBottom:10, textTransform:"uppercase" }}>안내사항</div>
                    <div style={{ color:"rgba(255,255,255,0.75)", fontSize:12, lineHeight:1.9 }}>
                      안녕하세요. 아이디병원 기획조정실입니다.<br/>
                      메일의 인증 링크를 누르시면 보안 문서를 열람하실 수 있습니다.<br/>
                      본 기능은 설정된 기한 내에만 제공되며,<br/>
                      기한이 종료될 경우 별도의 비밀번호가 추가로 필요합니다.<br/>
                      <span style={{ color:"rgba(255,255,255,0.45)", fontSize:11 }}>
                        문의사항은 사내 내선 <span style={{ color:"#e91e8c", fontWeight:700 }}>559</span>로 연락 바랍니다.
                      </span>
                    </div>
                  </div>
                  <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:10, padding:"16px", marginBottom:16 }}>
                    <div style={{ color:"rgba(255,255,255,0.35)", fontSize:11, fontWeight:700, letterSpacing:1, marginBottom:10, textTransform:"uppercase" }}>Notice (English)</div>
                    <div style={{ color:"rgba(255,255,255,0.5)", fontSize:12, lineHeight:1.9 }}>
                      Hello, this is the Planning {"&"} Coordination Department of ID Hospital.<br/>
                      Please click the verification link in the email to access the secure document.<br/>
                      Access is available only within the designated period.<br/>
                      After the deadline, an additional password will be required.<br/>
                      <span style={{ color:"rgba(255,255,255,0.35)", fontSize:11 }}>
                        For inquiries, please contact us at internal extension <span style={{ color:"rgba(233,30,140,0.7)", fontWeight:700 }}>559</span>.
                      </span>
                    </div>
                  </div>
                  <div style={{ background:"rgba(255,255,255,0.04)", borderRadius:8, padding:"10px 14px", marginBottom:14, textAlign:"center" }}>
                    <div style={{ color:"rgba(255,255,255,0.4)", fontSize:11 }}>
                      {"📌"} 메일이 보이지 않으면 <span style={{ color:"#f472b6" }}>스팸메일함</span>을 확인해주세요
                    </div>
                  </div>
                  <button onClick={()=>{ setStep(expired?"pwcheck":"input"); setError(""); setPwInput(""); }}
                    style={{ width:"100%", background:"transparent", border:"1px solid rgba(255,255,255,0.2)", color:"rgba(255,255,255,0.6)", borderRadius:10, padding:"12px 0", fontWeight:600, fontSize:13, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                    다시 시도하기
                  </button>
                </div>
              )}
            </div>
          </div>

          <div style={{ padding:"20px 32px", textAlign:"center", borderTop:"1px solid rgba(255,255,255,0.06)" }}>
            <div style={{ color:"rgba(255,255,255,0.5)", fontSize:11, letterSpacing:1.5, textTransform:"uppercase", lineHeight:1.8 }}>IDH · Planning {"&"} Coordination Dept.</div>
            <div style={{ color:"rgba(255,255,255,0.25)", fontSize:10, marginTop:4 }}>ID Hospital · 서울시 강남구 도산대로 142</div>
          </div>
        </div>
      );
    }

    // ── STATS PAGE ─────────────────────────────────────────────────────────────
    // ── 문서별 카드 (최신순 5건 + 더보기) ─────────────────────────────────────
    function DocCard({ doc }) {
      const [showAll, setShowAll] = useState(false);
      // 최신순 정렬
      const sorted = [...doc.docLogs].sort((a,b) => new Date(b.time) - new Date(a.time));
      const visible = showAll ? sorted : sorted.slice(0, 5);
      const remain  = sorted.length - 5;
      // 조회수 대비 기록 누락 추정 (과거 버그로 유실된 건수)
      const missing = Math.max(0, (doc.viewCount||0) - doc.docLogs.length);

      return (
        <div style={{ background:"#fff", borderRadius:12, marginBottom:16, overflow:"hidden", boxShadow:"0 2px 12px rgba(26,35,64,0.07)" }}>
          {/* 헤더 */}
          <div style={{ background:"linear-gradient(135deg,#1a2340,#2d3a6b)", padding:"16px 20px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8 }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ color:"#e91e8c", fontSize:10, fontWeight:700, letterSpacing:1 }}>DOCUMENT</div>
              <div style={{ color:"#fff", fontWeight:800, fontSize:15, marginTop:2 }}>{doc.docName || doc.id}</div>
              {doc.docName && <div style={{ color:"rgba(255,255,255,0.4)", fontSize:10, marginTop:2 }}>{doc.id}</div>}
              {doc.url && (
                <button onClick={()=>window.open(doc.url,"_blank")}
                  style={{ marginTop:8, background:"rgba(233,30,140,0.2)", border:"1px solid rgba(233,30,140,0.4)", color:"#f472b6", borderRadius:6, padding:"4px 12px", fontSize:11, fontWeight:600, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                  📄 문서 열기 →
                </button>
              )}
            </div>
            <div style={{ display:"flex", gap:12, alignItems:"center" }}>
              <div style={{ textAlign:"center" }}>
                <div style={{ color:"#e91e8c", fontWeight:800, fontSize:20 }}>{doc.viewCount||0}</div>
                <div style={{ color:"rgba(255,255,255,0.5)", fontSize:10 }}>열람 횟수</div>
              </div>
              <div style={{ textAlign:"center" }}>
                <div style={{ color:"#e91e8c", fontWeight:800, fontSize:20 }}>{doc.viewers.length}</div>
                <div style={{ color:"rgba(255,255,255,0.5)", fontSize:10 }}>열람자</div>
              </div>
            </div>
          </div>

          {/* 기록 누락 안내 */}
          {missing > 0 && (
            <div style={{ background:"#fff8ed", borderBottom:"1px solid #f5e6cc", padding:"8px 20px", display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:12 }}>⚠️</span>
              <span style={{ color:"#9a6b1f", fontSize:11, lineHeight:1.5 }}>
                열람 기록 <b>{missing}건 누락 추정</b> — 조회수({doc.viewCount||0})와 저장된 기록({doc.docLogs.length})의 차이입니다. 과거 시스템 오류로 열람자 정보가 저장되지 못한 건으로, 복구는 불가합니다.
              </span>
            </div>
          )}

          {/* 열람 내역 테이블 */}
          {doc.docLogs.length > 0 ? (
            <div style={{ padding:"0 20px 16px" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", marginTop:16 }}>
                <thead>
                  <tr>
                    {["소속 및 직책","열람 시간"].map(h=>(
                      <th key={h} style={{ textAlign:"left", color:"#8892a4", fontSize:11, fontWeight:600, padding:"8px 0", borderBottom:"1px solid #eee", letterSpacing:0.5 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {visible.map((log,i)=>(
                    <tr key={i} style={{ borderBottom:"1px solid #f5f6f9" }}>
                      <td style={{ padding:"10px 0", color:"#1a2340", fontWeight:600, fontSize:13 }}>{log.name}</td>
                      <td style={{ padding:"10px 0", color:"#8892a4", fontSize:12 }}>{new Date(log.time).toLocaleString("ko-KR")}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {/* 더보기 / 접기 버튼 */}
              {sorted.length > 5 && (
                <button onClick={()=>setShowAll(!showAll)}
                  style={{ width:"100%", marginTop:12, padding:"9px 0", background:"rgba(26,35,64,0.05)", border:"1px solid #dde1ea", borderRadius:8, color:"#1a2340", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                  {showAll ? "▲ 접기" : `▼ 더보기 (${remain}건 더 있음)`}
                </button>
              )}
            </div>
          ) : (
            <div style={{ padding:"16px 20px", color:"#aab0be", fontSize:13 }}>아직 열람 기록이 없습니다</div>
          )}
        </div>
      );
    }

    function PersonCard({ name, entries, docs }) {
      const [showAll, setShowAll] = useState(false);
      const sorted  = [...entries].sort((a,b) => new Date(b.time) - new Date(a.time));
      const visible = showAll ? sorted : sorted.slice(0, 5);
      const remain  = sorted.length - 5;
      const getDoc  = (docId) => docs.find(d => d.id === docId);
      return (
        <div style={{ background:"#fff", borderRadius:12, marginBottom:12, overflow:"hidden", boxShadow:"0 2px 8px rgba(26,35,64,0.06)" }}>
          <div style={{ background:"linear-gradient(135deg,#2d3a6b,#3d4f8a)", padding:"12px 20px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ color:"#fff", fontWeight:700, fontSize:14 }}>{name}</div>
            <div style={{ background:"rgba(233,30,140,0.25)", color:"#f472b6", fontSize:11, fontWeight:700, padding:"3px 10px", borderRadius:20 }}>
              총 {entries.length}회 열람
            </div>
          </div>
          <div style={{ padding:"0 20px 12px" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", marginTop:12 }}>
              <thead>
                <tr>
                  {["문서","열람 시간"].map(h=>(
                    <th key={h} style={{ textAlign:"left", color:"#8892a4", fontSize:11, fontWeight:600, padding:"6px 0", borderBottom:"1px solid #eee" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {visible.map((e,i)=>{
                  const d = getDoc(e.docId);
                  return (
                    <tr key={i} style={{ borderBottom:"1px solid #f5f6f9" }}>
                      <td style={{ padding:"8px 0" }}>
                        {d?.url
                          ? <button onClick={()=>window.open(d.url,"_blank")}
                              style={{ background:"none", border:"none", padding:0, cursor:"pointer", textAlign:"left", fontFamily:"'Sora',sans-serif" }}>
                              <span style={{ color:"#1a2340", fontSize:12, fontWeight:600 }}>{d.docName || e.docId}</span>
                              <span style={{ color:"#e91e8c", fontSize:11, marginLeft:4 }}>↗</span>
                            </button>
                          : <span style={{ color:"#1a2340", fontSize:12, fontWeight:600 }}>{d?.docName || e.docId}</span>
                        }
                      </td>
                      <td style={{ padding:"8px 0", color:"#8892a4", fontSize:11 }}>{new Date(e.time).toLocaleString("ko-KR")}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {sorted.length > 5 && (
              <button onClick={()=>setShowAll(!showAll)}
                style={{ width:"100%", marginTop:10, padding:"8px 0", background:"rgba(26,35,64,0.05)", border:"1px solid #dde1ea", borderRadius:8, color:"#1a2340", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                {showAll ? "▲ 접기" : `▼ 더보기 (${remain}건 더 있음)`}
              </button>
            )}
          </div>
        </div>
      );
    }

    // ── STATS PAGE ─────────────────────────────────────────────────────────────
    function StatsPage({ docs, logs, loadingLogs }) {
      const [statsTab, setStatsTab] = useState("doc"); // "doc" | "person"

      // 문서별 — 최신 열람순으로 문서 정렬
      const docStats = docs.map(doc => {
        const docLogs = logs.filter(l => l.docId === doc.id);
        const viewers = [...new Set(docLogs.map(l => l.name))];
        const latest  = docLogs.reduce((m,l) => (!m || l.time > m) ? l.time : m, null);
        return { ...doc, docLogs, viewers, latest };
      }).sort((a,b) => {
        if (!a.latest && !b.latest) return 0;
        if (!a.latest) return 1;
        if (!b.latest) return -1;
        return new Date(b.latest) - new Date(a.latest);
      });

      // 소속·직책별 — 이름으로 그룹핑, 최근 열람순 정렬
      const personMap = {};
      logs.forEach(l => {
        if (!personMap[l.name]) personMap[l.name] = [];
        personMap[l.name].push(l);
      });
      const personList = Object.entries(personMap)
        .map(([name, entries]) => ({ name, entries, latest: entries.reduce((m,e)=>e.time>m?e.time:m,"") }))
        .sort((a,b) => new Date(b.latest) - new Date(a.latest));

      const tabStyle = t => ({
        flex:1, padding:"10px 0", border:"none", cursor:"pointer",
        fontFamily:"'Sora',sans-serif", fontWeight: statsTab===t ? 700 : 500,
        fontSize:13, transition:"all .2s",
        background: statsTab===t ? "#1a2340" : "transparent",
        color: statsTab===t ? "#fff" : "#8892a4",
        borderRadius: statsTab===t ? 8 : 0,
      });

      return (
        <div style={{ minHeight:"100vh", background:"#f0f2f7", fontFamily:"'Sora',sans-serif", paddingBottom:80 }}>
          <div style={{ background:"#1a2340", padding:"0 32px", display:"flex", alignItems:"center", justifyContent:"space-between", height:64, boxShadow:"0 2px 12px rgba(26,35,64,0.2)" }}>
            <IDHLogo dark />
            <div style={{ color:"#e91e8c", fontWeight:700, fontSize:13, letterSpacing:2, textTransform:"uppercase" }}>문서 열람 통계</div>
          </div>

          <div style={{ maxWidth:800, margin:"40px auto", padding:"0 16px" }}>
            {/* 요약 카드 */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:16, marginBottom:24 }}>
              {[
                { label:"전체 공유 문서",      value:docs.length,                        icon:"📄" },
                { label:"전체 열람 횟수",       value:logs.length,                        icon:"👁" },
                { label:"열람자 수 (중복제거)", value:new Set(logs.map(l=>l.name)).size,  icon:"👤" },
              ].map((c,i)=>(
                <div key={i} style={{ background:"#fff", borderRadius:12, padding:20, boxShadow:"0 2px 12px rgba(26,35,64,0.07)", textAlign:"center" }}>
                  <div style={{ fontSize:28, marginBottom:8 }}>{c.icon}</div>
                  <div style={{ fontSize:28, fontWeight:800, color:"#1a2340" }}>{c.value}</div>
                  <div style={{ color:"#8892a4", fontSize:11, marginTop:2 }}>{c.label}</div>
                </div>
              ))}
            </div>

            {/* 뷰 전환 탭 */}
            <div style={{ background:"#fff", borderRadius:10, padding:6, display:"flex", gap:4, marginBottom:20, boxShadow:"0 2px 8px rgba(26,35,64,0.06)" }}>
              <button style={tabStyle("doc")}    onClick={()=>setStatsTab("doc")}>📄 문서별 내역</button>
              <button style={tabStyle("person")} onClick={()=>setStatsTab("person")}>👤 소속·직책별 내역</button>
            </div>

            {loadingLogs ? <Loader text="통계 불러오는 중..."/> :
              <>
                {/* 문서별 뷰 */}
                {statsTab==="doc" && (
                  docStats.length===0
                    ? <div style={{ background:"#fff", borderRadius:12, padding:40, textAlign:"center", color:"#aab0be" }}>공유된 문서가 없습니다</div>
                    : docStats.map(doc => <DocCard key={doc.id} doc={doc}/>)
                )}

                {/* 소속·직책별 뷰 */}
                {statsTab==="person" && (
                  personList.length===0
                    ? <div style={{ background:"#fff", borderRadius:12, padding:40, textAlign:"center", color:"#aab0be" }}>열람 기록이 없습니다</div>
                    : personList.map(p => <PersonCard key={p.name} name={p.name} entries={p.entries} docs={docs}/>)
                )}
              </>
            }
          </div>
        </div>
      );
    }

    // ── NAV BAR ────────────────────────────────────────────────────────────────
    function NavBar({ page, setPage }) {
      return (
        <div style={{ position:"fixed", bottom:16, left:"50%", transform:"translateX(-50%)", background:"rgba(26,35,64,0.95)", backdropFilter:"blur(12px)", borderRadius:50, padding:"8px 20px", display:"flex", gap:4, zIndex:999, boxShadow:"0 4px 24px rgba(0,0,0,0.3)", border:"1px solid rgba(255,255,255,0.1)" }}>
          {[{id:"admin",label:"Admin"},{id:"stats",label:"통계"}].map(it=>(
            <button key={it.id} onClick={()=>setPage(it.id)}
              style={{ background:page===it.id?"#e91e8c":"transparent", color:page===it.id?"#fff":"rgba(255,255,255,0.6)", border:"none", borderRadius:24, padding:"7px 18px", cursor:"pointer", fontWeight:700, fontSize:12, fontFamily:"'Sora',sans-serif", transition:"all .2s", whiteSpace:"nowrap" }}>
              {it.label}
            </button>
          ))}
        </div>
      );
    }

    // ── ROOT APP ───────────────────────────────────────────────────────────────
    function App() {
      const [ready,      setReady]     = useState(false);
      const [docs,       setDocs]      = useState([]);
      const [counter,    setCounter]   = useState(1);
      const [defaultPw,  setDefaultPw] = useState("1234");
      const [logs,       setLogs]      = useState([]);
      const [page,       setPage]      = useState("admin");
      const [loadingDoc, setLoadingDoc]= useState(true);
      const [loadingLog, setLoadingLog]= useState(false);

      const urlParams = new URLSearchParams(window.location.search);
      const viewId    = urlParams.get("view");

      // Firebase 준비 대기 후 초기 데이터 로드 (폴링 방식 - 타이밍 문제 방지)
      useEffect(()=>{
        let cancelled = false;
        const init = async () => {
          try {
            // 열람자 접속(view 링크)이면 필요한 문서 1개만 빠르게 조회
            if (viewId) {
              const [d, p] = await Promise.all([
                window.DB.getDoc(viewId),
                window.DB.getDefaultPw()
              ]);
              if (cancelled) return;
              setDocs(d ? [d] : []);
              setDefaultPw(p);
              setLoadingDoc(false);
              setReady(true);
              setPage("access");
              return;
            }
            // Admin 접속: 전체 데이터를 병렬로 조회
            const [d, c, p] = await Promise.all([
              window.DB.getDocs(),
              window.DB.getCounter(),
              window.DB.getDefaultPw()
            ]);
            if (cancelled) return;
            setDocs(d);
            setCounter(c);
            setDefaultPw(p);
            setLoadingDoc(false);
            setReady(true);
          } catch(e) {
            console.error("초기화 오류:", e);
            if (!cancelled) { setLoadingDoc(false); setReady(true); if (viewId) setPage("access"); }
          }
        };
        // window.DB가 준비될 때까지 폴링 (최대 10초)
        let tries = 0;
        const timer = setInterval(()=>{
          if (window.__DB_READY__ && window.DB) {
            clearInterval(timer);
            init();
          } else if (++tries > 100) {
            clearInterval(timer);
            if (!cancelled) { setLoadingDoc(false); setReady(true); }
          }
        }, 100);
        return ()=>{ cancelled = true; clearInterval(timer); };
      }, []);

      const refreshDocs = async () => {
        setDocs(await window.DB.getDocs());
      };
      const refreshStats = async () => {
        setLoadingLog(true);
        setDocs(await window.DB.getDocs());
        setLogs(await window.DB.getLogs());
        setLoadingLog(false);
      };

      useEffect(()=>{ if(page==="stats") refreshStats(); }, [page]);

      const handleAccessSuccess = useCallback((url)=>{ window.open(url,"_blank"); },[]);

      if (!ready) return (
        <div style={{ minHeight:"100vh", background:"#1a2340", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:20 }}>
          <IDHLogo dark />
          <div style={{ marginTop:16 }}><div className="spinner"/></div>
          <div style={{ color:"rgba(255,255,255,0.4)", fontSize:13 }}>시스템을 불러오는 중...</div>
        </div>
      );

      return (
        <>
          {page==="admin" && (
            <AdminPage docs={docs} counter={counter} setCounter={setCounter} defaultPw={defaultPw} setDefaultPw={setDefaultPw} refreshDocs={refreshDocs}/>
          )}
          {page==="stats" && <StatsPage docs={docs} logs={logs} loadingLogs={loadingLog}/>}
          {page==="access" && (
            <PasswordPage docId={viewId} docs={docs} defaultPw={defaultPw} onSuccess={handleAccessSuccess} loading={loadingDoc}/>
          )}
          {(page==="admin"||page==="stats") && <NavBar page={page} setPage={setPage}/>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
