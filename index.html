<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDH Secure Share · 아이디병원</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sora', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    @keyframes shake {
      0%,100%{ transform:translateX(0) }
      20%    { transform:translateX(-8px) }
      40%    { transform:translateX(8px) }
      60%    { transform:translateX(-6px) }
      80%    { transform:translateX(6px) }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width:40px; height:40px; border:3px solid rgba(233,30,140,0.2); border-top-color:#e91e8c; border-radius:50%; animation:spin .8s linear infinite; }
  </style>
  <script>
    // 전역 에러를 화면에 표시 (흰 화면 진단용)
    window.addEventListener("error", function(e){
      var r = document.getElementById("root");
      if (r) r.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#c4166e;font-size:13px;line-height:1.6;word-break:break-all;">'
        + '<b>오류 발생:</b><br>' + (e.message || e.error || "알 수 없는 오류")
        + '<br><br><span style="color:#8892a4;">' + (e.filename||"") + ' : ' + (e.lineno||"") + '행</span></div>';
    });
    window.addEventListener("unhandledrejection", function(e){
      var r = document.getElementById("root");
      if (r && r.textContent.indexOf("불러오는") >= 0) r.innerHTML =
        '<div style="padding:24px;font-family:sans-serif;color:#c4166e;font-size:13px;line-height:1.6;word-break:break-all;">'
        + '<b>연결 오류:</b><br>' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div>';
    });
  </script>
</head>
<body>
  <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#8892a4;font-size:14px;">불러오는 중...</div></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import {
      getAuth, sendSignInLinkToEmail, isSignInWithEmailLink,
      signInWithEmailLink, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCstceNikassZ1WJ0uY7xOFQ0X71mvOgw4",
      authDomain: "idh--share.firebaseapp.com",
      databaseURL: "https://idh--share-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "idh--share",
      storageBucket: "idh--share.firebasestorage.app",
      messagingSenderId: "881686477075",
      appId: "1:881686477075:web:d3d8a3af0b54a826e602e6"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);

    // ── Auth helpers ────────────────────────────────────────────────────────────
    window.AUTH = {
      // @idhospital.com 메일로 인증 링크 발송
      async sendLink(email, redirectUrl) {
        if (!email.toLowerCase().endsWith("@idhospital.com")) {
          throw new Error("@idhospital.com 사내 메일만 사용 가능합니다.");
        }
        const actionCodeSettings = {
          url: redirectUrl,
          handleCodeInApp: true,
        };
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        localStorage.setItem("emailForSignIn", email);
      },
      // 메일 링크로 돌아왔을 때 자동 로그인
      async handleEmailLink() {
        if (!isSignInWithEmailLink(auth, window.location.href)) return null;
        let email = localStorage.getItem("emailForSignIn");
        if (!email) email = window.prompt("인증에 사용한 이메일을 입력해주세요.");
        if (!email) return null;
        const result = await signInWithEmailLink(auth, email, window.location.href);
        localStorage.removeItem("emailForSignIn");
        // URL 정리 (인증 파라미터 제거, view 파라미터 유지)
        const params = new URLSearchParams(window.location.search);
        const viewId = params.get("view");
        const clean  = window.location.pathname + (viewId ? `?view=${viewId}` : "");
        window.history.replaceState(null, "", clean);
        return result.user;
      },
      // 현재 로그인 상태 구독
      onAuthChange(cb) {
        return onAuthStateChanged(auth, cb);
      },
      async signOut() {
        await signOut(auth);
      },
      getCurrentUser() {
        return auth.currentUser;
      }
    };

    // ── DB helpers ──────────────────────────────────────────────────────────────
    window.DB = {
      async getDocs() {
        const snap = await get(ref(db, "documents"));
        return snap.exists() ? Object.values(snap.val()) : [];
      },
      async getCounter() {
        const snap = await get(ref(db, "counter"));
        return snap.exists() ? snap.val() : 1;
      },
      async saveDoc(doc) {
        await set(ref(db, `documents/${doc.id}`), doc);
      },
      async setCounter(n) {
        await set(ref(db, "counter"), n);
      },
      async getDefaultPw() {
        const snap = await get(ref(db, "defaultPw"));
        return snap.exists() ? snap.val() : "1234";
      },
      async setDefaultPw(pw) {
        await set(ref(db, "defaultPw"), pw);
      },
      async getLogs() {
        const snap = await get(ref(db, "logs"));
        if (!snap.exists()) return [];
        return Object.values(snap.val());
      },
      async addLog(log) {
        await push(ref(db, "logs"), log);
      },
      async incViewCount(docId) {
        const snap = await get(ref(db, `documents/${docId}/viewCount`));
        const cur  = snap.exists() ? snap.val() : 0;
        await set(ref(db, `documents/${docId}/viewCount`), cur + 1);
      },
      onDocs(cb) {
        return onValue(ref(db, "documents"), snap => {
          cb(snap.exists() ? Object.values(snap.val()) : []);
        });
      },
    };

    window.__DB_READY__ = true;
    window.dispatchEvent(new Event("firebase-ready"));
  </script>

  <!-- React + Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel" data-presets="react" data-type="module">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── Helpers ────────────────────────────────────────────────────────────────
    function genLinkId(n) { return `IDH-Planning-Coordination-${String(n).padStart(3,"0")}`; }

    // ── Logo ───────────────────────────────────────────────────────────────────
    function IDHLogo({ dark }) {
      const korColor = dark ? "#ffffff" : "#1a2340";
      const subColor = dark ? "rgba(255,255,255,0.55)" : "#8892a4";
      return (
        <div style={{ display:"flex", alignItems:"center", gap:8, userSelect:"none" }}>
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="14" fill="#e91e8c"/>
            <text x="18" y="23" textAnchor="middle" fill="white"
                  fontSize="13" fontWeight="900" fontFamily="'Sora','Arial',sans-serif" letterSpacing="-0.5">id</text>
          </svg>
          <div style={{ lineHeight:1 }}>
            <div style={{ color:korColor, fontWeight:800, fontSize:16, fontFamily:"'Sora','Apple SD Gothic Neo','Malgun Gothic',sans-serif", letterSpacing:0.2, lineHeight:1.15 }}>아이디병원</div>
            <div style={{ color:subColor, fontWeight:500, fontSize:9.5, fontFamily:"'Sora',sans-serif", letterSpacing:1.6, textTransform:"uppercase", marginTop:1 }}>ID HOSPITAL</div>
          </div>
        </div>
      );
    }

    // ── Shared UI ──────────────────────────────────────────────────────────────
    const inputStyle = {
      width:"100%", border:"1.5px solid #dde1ea", borderRadius:9,
      padding:"11px 13px", fontSize:14, outline:"none",
      boxSizing:"border-box", fontFamily:"'Sora',sans-serif",
      color:"#1a2340", background:"#f8f9fc", transition:"border-color .2s"
    };
    function Field({ label, children }) {
      return (
        <div style={{ marginBottom:20 }}>
          <label style={{ color:"#4a5568", fontSize:12, fontWeight:600, display:"block", marginBottom:7, letterSpacing:0.3 }}>{label}</label>
          {children}
        </div>
      );
    }
    function InfoChip({ label, value }) {
      return <span style={{ fontSize:11, color:"#8892a4" }}><span style={{ fontWeight:700, color:"#1a2340" }}>{label}: </span>{value}</span>;
    }
    function CopyLinkBtn({ docId }) {
      const [copied, setCopied] = useState(false);
      return (
        <button onClick={() => {
          const link = `${window.location.origin}${window.location.pathname}?view=${docId}`;
          navigator.clipboard.writeText(link).then(() => { setCopied(true); setTimeout(()=>setCopied(false),2000); });
        }} style={{ flex:1, background: copied?"#e91e8c":"rgba(233,30,140,0.08)", color: copied?"#fff":"#e91e8c", border:"1.5px solid #e91e8c", borderRadius:8, padding:"9px 0", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Sora',sans-serif", transition:"all .2s" }}>
          {copied ? "✓ 복사됨" : "🔗 공유 링크 복사"}
        </button>
      );
    }
    function Loader({ text }) {
      return (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16, padding:"60px 0" }}>
          <div className="spinner"/>
          <div style={{ color:"#8892a4", fontSize:13 }}>{text || "불러오는 중..."}</div>
        </div>
      );
    }

    // ── ADMIN PAGE ─────────────────────────────────────────────────────────────
    function AdminPage({ docs, counter, setCounter, defaultPw, setDefaultPw, refreshDocs }) {
      const [tab, setTab]             = useState("create");
      const [form, setForm]           = useState({ docName:"", url:"", password:"", confirmPw:"", expiryDate:"", expiryHour:"23" });
      const [newDefaultPw, setNewDPw] = useState("");
      const [confirmDef, setConfDef]  = useState("");
      const [showDef, setShowDef]     = useState(false);
      const [created, setCreated]     = useState(null);
      const [copied, setCopied]       = useState(false);
      const [error, setError]         = useState("");
      const [pwError, setPwError]     = useState("");
      const [saving, setSaving]       = useState(false);

      const handleCreate = async () => {
        setError("");
        if (!form.docName.trim())               { setError("문서 이름을 입력해주세요."); return; }
        if (!form.url)                          { setError("문서 URL을 입력해주세요."); return; }
        if (!form.password)                     { setError("비밀번호를 입력해주세요."); return; }
        if (form.password !== form.confirmPw)   { setError("비밀번호가 일치하지 않습니다."); return; }
        if (!form.expiryDate)                   { setError("만료 날짜를 설정해주세요."); return; }

        setSaving(true);
        const linkId    = genLinkId(counter);
        const expiryISO = new Date(`${form.expiryDate}T${String(form.expiryHour).padStart(2,"0")}:00:00`).toISOString();
        const newDoc    = { id:linkId, docName:form.docName.trim(), url:form.url, password:form.password, expiry:expiryISO, createdAt:new Date().toISOString(), viewCount:0 };

        await window.DB.saveDoc(newDoc);
        await window.DB.setCounter(counter + 1);
        setCounter(counter + 1);
        setCreated(newDoc);
        setForm({ docName:"", url:"", password:"", confirmPw:"", expiryDate:"", expiryHour:"23" });
        setSaving(false);
      };

      const shareLink = created ? `${window.location.origin}${window.location.pathname}?view=${created.id}` : "";

      const handleSetDefault = async () => {
        setPwError("");
        if (!/^\d{4}$/.test(newDefaultPw))    { setPwError("4자리 숫자만 입력 가능합니다."); return; }
        if (newDefaultPw !== confirmDef)       { setPwError("비밀번호가 일치하지 않습니다."); return; }
        await window.DB.setDefaultPw(newDefaultPw);
        setDefaultPw(newDefaultPw);
        setNewDPw(""); setConfDef("");
        alert("디폴트 비밀번호가 설정되었습니다.");
      };

      const tabStyle = t => ({
        padding:"10px 22px", borderRadius:"8px 8px 0 0",
        background: tab===t ? "#1a2340" : "transparent",
        color: tab===t ? "#fff" : "#8892a4",
        fontWeight: tab===t ? 700 : 500,
        cursor:"pointer", border:"none", fontSize:13,
        fontFamily:"'Sora',sans-serif", transition:"all .2s",
      });

      return (
        <div style={{ minHeight:"100vh", background:"#f0f2f7", fontFamily:"'Sora',sans-serif", paddingBottom:80 }}>
          <div style={{ background:"#1a2340", padding:"0 32px", display:"flex", alignItems:"center", justifyContent:"space-between", height:64, boxShadow:"0 2px 12px rgba(26,35,64,0.2)" }}>
            <IDHLogo dark />
            <div style={{ color:"#e91e8c", fontWeight:700, fontSize:13, letterSpacing:2, textTransform:"uppercase" }}>Planning & Coordination · Admin</div>
          </div>

          <div style={{ maxWidth:720, margin:"40px auto", padding:"0 16px" }}>
            <div style={{ marginBottom:24 }}>
              <h1 style={{ color:"#1a2340", fontSize:24, fontWeight:800, margin:0, letterSpacing:-0.5 }}>문서 보안 공유 시스템</h1>
              <p style={{ color:"#8892a4", fontSize:13, margin:"6px 0 0" }}>민감 문서를 비밀번호로 보호하여 안전하게 공유하세요</p>
            </div>

            <div style={{ display:"flex", borderBottom:"2px solid #1a2340" }}>
              <button style={tabStyle("create")}    onClick={()=>setTab("create")}>링크 생성</button>
              <button style={tabStyle("list")}      onClick={()=>{ setTab("list"); refreshDocs(); }}>생성 목록 ({docs.length})</button>
              <button style={tabStyle("defaultpw")} onClick={()=>setTab("defaultpw")}>디폴트 비밀번호</button>
            </div>

            <div style={{ background:"#fff", borderRadius:"0 8px 8px 8px", padding:32, boxShadow:"0 4px 20px rgba(26,35,64,0.08)" }}>

              {/* CREATE */}
              {tab==="create" && (
                <div>
                  {created && (
                    <div style={{ background:"linear-gradient(135deg,#1a2340,#2d3a6b)", borderRadius:12, padding:24, marginBottom:28, position:"relative", overflow:"hidden" }}>
                      <div style={{ position:"absolute", right:-20, top:-20, width:120, height:120, borderRadius:"50%", background:"rgba(233,30,140,0.15)" }}/>
                      <div style={{ color:"#e91e8c", fontWeight:700, fontSize:11, letterSpacing:2, marginBottom:8 }}>✓ 링크 생성 완료</div>
                      <div style={{ color:"#fff", fontWeight:800, fontSize:16, marginBottom:2 }}>{created.docName}</div>
                      <div style={{ color:"rgba(255,255,255,0.45)", fontSize:11, marginBottom:6 }}>{created.id}</div>
                      <div style={{ background:"rgba(255,255,255,0.1)", borderRadius:8, padding:"10px 14px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginTop:12 }}>
                        <span style={{ color:"#c8d0e0", fontSize:11, wordBreak:"break-all", flex:1 }}>{shareLink}</span>
                        <button onClick={()=>{ navigator.clipboard.writeText(shareLink).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }); }}
                          style={{ background:copied?"#e91e8c":"rgba(233,30,140,0.2)", color:copied?"#fff":"#e91e8c", border:"1px solid #e91e8c", borderRadius:6, padding:"6px 14px", cursor:"pointer", fontWeight:700, fontSize:12, whiteSpace:"nowrap", transition:"all .2s" }}>
                          {copied ? "✓ 복사됨" : "링크 복사"}
                        </button>
                      </div>
                      <button onClick={()=>setCreated(null)} style={{ marginTop:12, background:"transparent", border:"none", color:"#8892a4", fontSize:11, cursor:"pointer" }}>닫기</button>
                    </div>
                  )}

                  {error && <div style={{ background:"#fff0f4", border:"1px solid #e91e8c", borderRadius:8, padding:"10px 14px", color:"#c4166e", fontSize:13, marginBottom:20 }}>{error}</div>}

                  <Field label="문서 이름 *">
                    <input value={form.docName} onChange={e=>setForm({...form,docName:e.target.value})}
                      placeholder="예: 2605월 마감보고 · Asian Beauty Center"
                      style={inputStyle}/>
                  </Field>
                  <Field label="문서 URL (Google Drive 등)">
                    <input value={form.url} onChange={e=>setForm({...form,url:e.target.value})} placeholder="https://drive.google.com/file/d/..." style={inputStyle}/>
                  </Field>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
                    <Field label="비밀번호 설정">
                      <input type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="비밀번호 입력" style={inputStyle}/>
                    </Field>
                    <Field label="비밀번호 확인">
                      <input type="password" value={form.confirmPw} onChange={e=>setForm({...form,confirmPw:e.target.value})} placeholder="비밀번호 재입력"
                        style={{...inputStyle, borderColor:form.confirmPw&&form.confirmPw!==form.password?"#e91e8c":"#dde1ea"}}/>
                    </Field>
                  </div>
                  <Field label="비밀번호 만료 설정">
                    <div style={{ display:"flex", gap:10 }}>
                      <input type="date" value={form.expiryDate} onChange={e=>setForm({...form,expiryDate:e.target.value})} style={{...inputStyle,flex:1}}/>
                      <select value={form.expiryHour} onChange={e=>setForm({...form,expiryHour:e.target.value})} style={{...inputStyle,width:110}}>
                        {Array.from({length:24},(_,i)=><option key={i} value={i}>{String(i).padStart(2,"0")}:00</option>)}
                      </select>
                    </div>
                    <p style={{ color:"#aab0be", fontSize:11, margin:"6px 0 0" }}>만료 후 디폴트 비밀번호로 자동 전환됩니다</p>
                  </Field>
                  <button onClick={handleCreate} disabled={saving}
                    style={{ width:"100%", background: saving?"#aab0be":"linear-gradient(135deg,#e91e8c,#c4166e)", color:"#fff", border:"none", borderRadius:10, padding:"14px 0", fontWeight:800, fontSize:15, cursor: saving?"not-allowed":"pointer", letterSpacing:0.5, boxShadow:"0 4px 16px rgba(233,30,140,0.35)", marginTop:8, fontFamily:"'Sora',sans-serif" }}>
                    {saving ? "저장 중..." : "설정 완료 · 공유 링크 생성"}
                  </button>
                </div>
              )}

              {/* LIST */}
              {tab==="list" && (
                <div>
                  {docs.length===0
                    ? <div style={{ textAlign:"center", color:"#aab0be", padding:"40px 0", fontSize:14 }}>생성된 링크가 없습니다</div>
                    : <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                        {[...docs].sort((a,b)=>b.createdAt?.localeCompare(a.createdAt||"")||0).map(doc => {
                          const expired  = new Date(doc.expiry) < new Date();
                          const activePw = expired ? defaultPw : doc.password;
                          return (
                            <div key={doc.id} style={{ border:"1px solid #dde1ea", borderRadius:10, padding:16, position:"relative", overflow:"hidden" }}>
                              <div style={{ position:"absolute", top:0, left:0, width:4, height:"100%", background:expired?"#aab0be":"#e91e8c" }}/>
                              <div style={{ paddingLeft:8 }}>
                                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:8 }}>
                                  <div>
                                    <div style={{ fontWeight:800, fontSize:14, color:"#1a2340" }}>{doc.docName || doc.id}</div>
                                    {doc.docName && <div style={{ fontWeight:500, fontSize:11, color:"#aab0be", marginTop:2 }}>{doc.id}</div>}
                                  </div>
                                  <span style={{ background:expired?"#f0f2f7":"#fff0f8", color:expired?"#8892a4":"#e91e8c", fontSize:10, fontWeight:700, padding:"3px 8px", borderRadius:20, border:`1px solid ${expired?"#dde1ea":"#f9a8d4"}` }}>
                                    {expired?"만료됨 (디폴트 PW)":"활성"}
                                  </span>
                                </div>
                                <div style={{ color:"#8892a4", fontSize:11, marginTop:4, wordBreak:"break-all" }}>{doc.url?.length>60?doc.url.slice(0,60)+"...":doc.url}</div>
                                <div style={{ display:"flex", gap:16, marginTop:8, flexWrap:"wrap" }}>
                                  <InfoChip label="만료" value={new Date(doc.expiry).toLocaleString("ko-KR")}/>
                                  <InfoChip label="현재 PW" value={activePw}/>
                                  <InfoChip label="조회" value={`${doc.viewCount||0}회`}/>
                                </div>
                                <div style={{ display:"flex", gap:8, marginTop:12 }}>
                                  <button onClick={()=>window.open(doc.url,"_blank")}
                                    style={{ flex:1, background:"linear-gradient(135deg,#1a2340,#2d3a6b)", color:"#fff", border:"none", borderRadius:8, padding:"9px 0", fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"'Sora',sans-serif" }}>
                                    📄 문서 바로가기
                                  </button>
                                  <CopyLinkBtn docId={doc.id}/>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                  }
                </div>
              )}

              {/* DEFAULT PW */}
              {tab==="defaultpw" && (
                <div>
                  <div style={{ background:"linear-gradient(135deg,#1a2340,#2d3a6b)", borderRadius:12, padding:20, marginBottom:24, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                    <div>
                      <div style={{ color:"#8892a4", fontSize:11, letterSpacing:1 }}>현재 디폴트 비밀번호</div>

    // ── EMAIL VERIFY PAGE ──────────────────────────────────────────────────────
    function PasswordPage({ docId, docs, onSuccess, loading }) {
      const [step,     setStep]     = useState("input");  // input | sent | verifying | error
      const [email,    setEmail]    = useState("");
      const [dept,     setDept]     = useState("");
      const [error,    setError]    = useState("");
      const [sending,  setSending]  = useState(false);
      const [shake,    setShake]    = useState(false);

      const doc = docs.find(d => d.id === docId);

      // 페이지 로드 시 — 메일 링크로 돌아온 경우 자동 처리
      useEffect(() => {
        if (!window.AUTH) return;
        const run = async () => {
          try {
            setStep("verifying");
            const user = await window.AUTH.handleEmailLink();
            if (!user) { setStep("input"); return; }
            // 인증 성공 → 로그 기록 후 문서 열기
            if (doc) {
              await window.DB.addLog({
                docId, name: user.email, time: new Date().toISOString(), linkId: doc.id
              });
              await window.DB.incViewCount(docId);
              onSuccess(doc.url);
            } else {
              setStep("input");
            }
          } catch(e) {
            setError(e.message || "인증에 실패했습니다. 다시 시도해주세요.");
            setStep("error");
          }
        };
        // 현재 URL이 이메일 링크인지 확인
        if (window.location.href.includes("apiKey") || window.location.href.includes("oobCode")) {
          run();
        } else {
          setStep("input");
        }
      }, [doc]);

      const handleSend = async () => {
        setError("");
        if (!email.trim())  { setError("이메일을 입력해주세요."); triggerShake(); return; }
        if (!email.toLowerCase().endsWith("@idhospital.com")) {
          setError("@idhospital.com 사내 메일만 사용 가능합니다."); triggerShake(); return;
        }
        if (!doc) { setError("존재하지 않는 문서입니다. 링크를 다시 확인해주세요."); return; }

        setSending(true);
        try {
          const redirectUrl = window.location.href;
          await window.AUTH.sendLink(email.trim().toLowerCase(), redirectUrl);
          setStep("sent");
        } catch(e) {
          setError(e.message || "메일 발송에 실패했습니다.");
          triggerShake();
        }
        setSending(false);
      };

      const triggerShake = () => { setShake(true); setTimeout(()=>setShake(false), 500); };

        <div style={{ minHeight:"100vh", background:"linear-gradient(160deg,#0d1526 0%,#1a2340 50%,#0d1526 100%)", display:"flex", flexDirection:"column", fontFamily:"'Sora',sans-serif", position:"relative", overflow:"hidden" }}>

          <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", padding:"20px 16px" }}>
            <div style={{ width:"100%", maxWidth:420 }}>

              {/* 문서 이름 표시 */}
              <div style={{ textAlign:"center", marginBottom:32 }}>
                <div style={{ width:72, height:72, background:"linear-gradient(135deg,#e91e8c,#c4166e)", borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 16px", boxShadow:"0 8px 32px rgba(233,30,140,0.4)" }}>
                  {step === "sent"
                    ? <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M3 8l9 6 9-6M5 6h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>
                    : <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" fill="white"/><path d="M8 11V7a4 4 0 018 0v4" stroke="white" strokeWidth="2" strokeLinecap="round"/></svg>

                </div>
                <h2 style={{ color:"#fff", fontSize:22, fontWeight:800, margin:0, letterSpacing:-0.5 }}>

                  <div style={{ background:"rgba(255,255,255,0.05)", backdropFilter:"blur(20px)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, padding:28 }}>

                      />
                      <div style={{ color:"rgba(255,255,255,0.3)", fontSize:11, marginTop:6 }}>@idhospital.com 사내 메일만 인증 가능합니다</div>
                    </div>
                    <button onClick={handleSend} disabled={sending}
                      style={{ width:"100%", background:sending?"#aab0be":"linear-gradient(135deg,#e91e8c,#c4166e)", color:"#fff", border:"none", borderRadius:10, padding:"14px 0", fontWeight:800, fontSize:15, cursor:sending?"not-allowed":"pointer", boxShadow:"0 4px 20px rgba(233,30,140,0.4)", fontFamily:"'Sora',sans-serif", letterSpacing:0.5 }}>

              {/* ── 메일 발송 완료 화면 ── */}
              {step === "sent" && (
                <div style={{ background:"rgba(255,255,255,0.05)", backdropFilter:"blur(20px)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:16, padding:28, textAlign:"center" }}>
                  <div style={{ color:"rgba(255,255,255,0.7)", fontSize:14, lineHeight:1.8, marginBottom:24 }}>

                    메일함에서 <span style={{ color:"#e91e8c", fontWeight:700 }}>"문서 열람 인증"</span> 버튼을 클릭하면<br/>

    // ── STATS PAGE ─────────────────────────────────────────────────────────────
    function StatsPage({ docs, logs, loadingLogs }) {
      const [statsTab, setStatsTab] = useState("doc"); // "doc" | "person"

      // 문서별 — 최신 열람순으로 문서 정렬
      const docStats = docs.map(doc => {
        const docLogs = logs.filter(l => l.docId === doc.id);
        const viewers = [...new Set(docLogs.map(l => l.name))];
        const latest  = docLogs.reduce((m,l) => (!m || l.time > m) ? l.time : m, null);
        return { ...doc, docLogs, viewers, latest };
      }).sort((a,b) => {
        if (!a.latest && !b.latest) return 0;
        if (!a.latest) return 1;
        if (!b.latest) return -1;
        return new Date(b.latest) - new Date(a.latest);
      });

      // 소속·직책별 — 이름으로 그룹핑, 최근 열람순 정렬
      const personMap = {};
      logs.forEach(l => {
        if (!personMap[l.name]) personMap[l.name] = [];
        personMap[l.name].push(l);
      });
      const personList = Object.entries(personMap)
        .map(([name, entries]) => ({ name, entries, latest: entries.reduce((m,e)=>e.time>m?e.time:m,"") }))
        .sort((a,b) => new Date(b.latest) - new Date(a.latest));

      const tabStyle = t => ({
        flex:1, padding:"10px 0", border:"none", cursor:"pointer",
        fontFamily:"'Sora',sans-serif", fontWeight: statsTab===t ? 700 : 500,
        fontSize:13, transition:"all .2s",
        background: statsTab===t ? "#1a2340" : "transparent",
        color: statsTab===t ? "#fff" : "#8892a4",
        borderRadius: statsTab===t ? 8 : 0,
      });

      return (
        <div style={{ minHeight:"100vh", background:"#f0f2f7", fontFamily:"'Sora',sans-serif", paddingBottom:80 }}>
          <div style={{ background:"#1a2340", padding:"0 32px", display:"flex", alignItems:"center", justifyContent:"space-between", height:64, boxShadow:"0 2px 12px rgba(26,35,64,0.2)" }}>
            <IDHLogo dark />
            <div style={{ color:"#e91e8c", fontWeight:700, fontSize:13, letterSpacing:2, textTransform:"uppercase" }}>문서 열람 통계</div>
          </div>

          <div style={{ maxWidth:800, margin:"40px auto", padding:"0 16px" }}>
            {/* 요약 카드 */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:16, marginBottom:24 }}>
              {[
                { label:"전체 공유 문서",      value:docs.length,                        icon:"📄" },
                { label:"전체 열람 횟수",       value:logs.length,                        icon:"👁" },
                { label:"열람자 수 (중복제거)", value:new Set(logs.map(l=>l.name)).size,  icon:"👤" },
              ].map((c,i)=>(
                <div key={i} style={{ background:"#fff", borderRadius:12, padding:20, boxShadow:"0 2px 12px rgba(26,35,64,0.07)", textAlign:"center" }}>
                  <div style={{ fontSize:28, marginBottom:8 }}>{c.icon}</div>
                  <div style={{ fontSize:28, fontWeight:800, color:"#1a2340" }}>{c.value}</div>
                  <div style={{ color:"#8892a4", fontSize:11, marginTop:2 }}>{c.label}</div>
                </div>
              ))}
            </div>

            {/* 뷰 전환 탭 */}
            <div style={{ background:"#fff", borderRadius:10, padding:6, display:"flex", gap:4, marginBottom:20, boxShadow:"0 2px 8px rgba(26,35,64,0.06)" }}>
              <button style={tabStyle("doc")}    onClick={()=>setStatsTab("doc")}>📄 문서별 내역</button>
              <button style={tabStyle("person")} onClick={()=>setStatsTab("person")}>👤 소속·직책별 내역</button>
            </div>

            {loadingLogs ? <Loader text="통계 불러오는 중..."/> :
              <>
                {/* 문서별 뷰 */}
                {statsTab==="doc" && (
                  docStats.length===0
                    ? <div style={{ background:"#fff", borderRadius:12, padding:40, textAlign:"center", color:"#aab0be" }}>공유된 문서가 없습니다</div>
                    : docStats.map(doc => <DocCard key={doc.id} doc={doc}/>)
                )}

                {/* 소속·직책별 뷰 */}
                {statsTab==="person" && (
                  personList.length===0
                    ? <div style={{ background:"#fff", borderRadius:12, padding:40, textAlign:"center", color:"#aab0be" }}>열람 기록이 없습니다</div>
                    : personList.map(p => <PersonCard key={p.name} name={p.name} entries={p.entries} docs={docs}/>)
                )}
              </>
            }
          </div>
        </div>
      );
    }

    // ── NAV BAR ────────────────────────────────────────────────────────────────
    function NavBar({ page, setPage }) {
      return (
        <div style={{ position:"fixed", bottom:16, left:"50%", transform:"translateX(-50%)", background:"rgba(26,35,64,0.95)", backdropFilter:"blur(12px)", borderRadius:50, padding:"8px 20px", display:"flex", gap:4, zIndex:999, boxShadow:"0 4px 24px rgba(0,0,0,0.3)", border:"1px solid rgba(255,255,255,0.1)" }}>
          {[{id:"admin",label:"Admin"},{id:"stats",label:"통계"}].map(it=>(
            <button key={it.id} onClick={()=>setPage(it.id)}
              style={{ background:page===it.id?"#e91e8c":"transparent", color:page===it.id?"#fff":"rgba(255,255,255,0.6)", border:"none", borderRadius:24, padding:"7px 18px", cursor:"pointer", fontWeight:700, fontSize:12, fontFamily:"'Sora',sans-serif", transition:"all .2s", whiteSpace:"nowrap" }}>
              {it.label}
            </button>
          ))}
        </div>
      );
    }

    // ── ROOT APP ───────────────────────────────────────────────────────────────
    function App() {
      const [ready,      setReady]     = useState(false);
      const [docs,       setDocs]      = useState([]);
      const [counter,    setCounter]   = useState(1);
      const [defaultPw,  setDefaultPw] = useState("1234");
      const [logs,       setLogs]      = useState([]);
      const [page,       setPage]      = useState("admin");
      const [loadingDoc, setLoadingDoc]= useState(true);
      const [loadingLog, setLoadingLog]= useState(false);

      const urlParams = new URLSearchParams(window.location.search);
      const viewId    = urlParams.get("view");

      // Firebase 준비 대기 후 초기 데이터 로드 (폴링 방식 - 타이밍 문제 방지)
      useEffect(()=>{
        let cancelled = false;
        const init = async () => {
          try {
            const d = await window.DB.getDocs();
            const c = await window.DB.getCounter();
            const p = await window.DB.getDefaultPw();
            if (cancelled) return;
            setDocs(d);
            setCounter(c);
            setDefaultPw(p);
            setLoadingDoc(false);
            setReady(true);
            if (viewId) setPage("access");
          } catch(e) {
            console.error("초기화 오류:", e);
            if (!cancelled) { setLoadingDoc(false); setReady(true); if (viewId) setPage("access"); }
          }
        };
        // window.DB가 준비될 때까지 폴링 (최대 10초)
        let tries = 0;
        const timer = setInterval(()=>{
          if (window.__DB_READY__ && window.DB) {
            clearInterval(timer);
            init();
          } else if (++tries > 100) {
            clearInterval(timer);
            if (!cancelled) { setLoadingDoc(false); setReady(true); }
          }
        }, 100);
        return ()=>{ cancelled = true; clearInterval(timer); };
      }, []);

      const refreshDocs = async () => {
        setDocs(await window.DB.getDocs());
      };
      const refreshStats = async () => {
        setLoadingLog(true);
        setDocs(await window.DB.getDocs());
        setLogs(await window.DB.getLogs());
        setLoadingLog(false);
      };

      useEffect(()=>{ if(page==="stats") refreshStats(); }, [page]);

      const handleAccessSuccess = useCallback((url)=>{ window.open(url,"_blank"); },[]);

      if (!ready) return (
        <div style={{ minHeight:"100vh", background:"#1a2340", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:20 }}>
          <IDHLogo dark />
          <div style={{ marginTop:16 }}><div className="spinner"/></div>
          <div style={{ color:"rgba(255,255,255,0.4)", fontSize:13 }}>시스템을 불러오는 중...</div>
        </div>
      );

      return (
        <>
          {page==="admin" && (
            <AdminPage docs={docs} counter={counter} setCounter={setCounter} defaultPw={defaultPw} setDefaultPw={setDefaultPw} refreshDocs={refreshDocs}/>
          )}
          {page==="stats" && <StatsPage docs={docs} logs={logs} loadingLogs={loadingLog}/>}
          {page==="access" && (
            <PasswordPage docId={viewId} docs={docs} onSuccess={handleAccessSuccess} loading={loadingDoc}/>
          )}
          {(page==="admin"||page==="stats") && <NavBar page={page} setPage={setPage}/>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
